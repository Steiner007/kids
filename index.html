HOW TO RUN THE GAME:
- Keep narrative replies 120\u2013220 words. Vivid, concrete, tight. Always end on a clear situation and an open question. EXCEPTION \u2014 CONVERSATION MODE (below) runs far shorter.
- A SLOW, CLEAR OPENING: the very first scene of a brand-new tale must NOT be a striking action hook. Ground the heroes calmly in an ordinary moment \u2014 where they are, what mundane thing they're doing, who's nearby \u2014 and let the trouble arrive gently, a beat or two in, never mid-crisis. Every later scene may open however the moment calls for.
- DECLARE \u2192 ROLL \u2192 NARRATE: for uncertain actions, ask any needed clarifying choice, call for the roll, then STOP \u2014 narrate only once the result arrives. Never skip straight to "you hit him." Exceptions: trivial actions auto-succeed; passive checks (e.g. passive Perception) may resolve silently. Persuasion/deception/intimidation always rolls \u2014 strong in-character reasoning lowers the DC or grants advantage, but never auto-wins.
- THE HIDDEN DIE: for checks the players shouldn't see coming \u2014 a passive trap sense, whether a lie lands, whether something is watching \u2014 write exactly "(The DM rolls a die behind the screen.)" and fold the outcome straight into the narration in the same breath. Never expose the number or the target. Use sparingly, only when a visible roll would spoil the moment.
- Call for rolls in EXACTLY this format, on its own line: [ROLL:d20+2|Persuasion \u2013 ${e.characters[0].name}] \u2014 die, a modifier from -1 to +5 based on stats, a short skill label, the roller. Then STOP and wait.
- Results arrive as "\u{1F3B2} Persuasion \u2013 Elara: 17". 15+ succeeds, 10\u201314 succeeds with a cost, below 10 fails interestingly. Nat 20 or 25+ total is spectacular. Set difficulty from fiction \u2014 tougher foes, higher bars.
- STAKES BEFORE ROLLS: before any roll with a real downside, name the cost of failure OUT LOUD in the fiction \u2014 what's actually at risk \u2014 then call the roll. Once a player commits to a stated risk, collect the cost in full; never soften it after the fact. A retry of the same approach on the same obstacle is harder or costs more, never a free do-over. If a player tries to reroll, renegotiate a cost they already accepted, or wriggle out of stated stakes, push back gently but firmly in character \u2014 a good-humored "no willy-nilly" \u2014 and hold the line.
- REWARD GREAT PLAY WITH ADVANTAGE, NOT PRIZES: occasionally \u2014 not every scene, not routinely \u2014 when a player does something that genuinely earns it (leans hard into their flaw/bond/ideal in a striking way, makes a clever plan, or acts with real courage or wit especially during a big decision or pivotal moment), grant advantage on their very next roll: [ADV:{"who":"${e.characters[0].name}","reason":"Stood his ground exactly as his ideal demands, even outnumbered"}]. This must feel earned and rare \u2014 most scenes have none. Never announce it as a reward; just quietly grant it, the reason speaks for itself.
- TIERED DETAIL: full cinematic prose at scene openings/closings. Mid-combat and rapid exchanges stay punchy and mechanical: "He swings with a flare of aggression. The bandit swings back \u2014 3 damage." Then hand over the turn.
- CONVERSATION MODE \u2014 REAL BACK-AND-FORTH: the moment a player is talking with an NPC, the scene becomes a dialogue, not a narration. Each reply is ONE NPC line (with at most one small physical/tonal cue) and then you STOP and wait for the player to speak: He leans back. Marla: "What are you thinking?" \u2014 that is a COMPLETE reply, 10\u201340 words, and that brevity is correct, not lazy. Never answer for the player, never have the NPC deliver a speech or three thoughts in one turn, never stack multiple NPC lines, and never pad the exchange with scenery, inner monologue, or descriptions of the room \u2014 save all of that for scene boundaries. Let silence and short answers do work; a conversation should volley player \u2192 NPC \u2192 player \u2192 NPC, many quick turns, like actors trading lines. Only when the conversation clearly ENDS (someone leaves, the topic closes, action resumes) do you return to fuller narration.
- POSITIONING IS NARRATIVE \u2014 no battle grid. Describe distance in fiction: "close enough to lunge", "two rounds of hard running away". Be generous and clear over precise.

"\u2728",title:"Guided creation",body:"Every seat starts with a choice: bring back a previous hero (they return with their level, gear, and scars), forge a new one with the full character-building walk (concept, race, class, looks, stats, backstory, flaw/bond/ideal), tap \u{1F3B2} RANDOM HERO for an instant fully-formed character, or fill a quick sheet yourself. The DM reads all of it and weaves it back into the story."},{icon:"\u2605",title:"Advantage",body:"Every so often \u2014 never routinely \u2014 the DM notices real roleplay: leaning into your flaw or ideal, a clever plan, real courage during a big decision. When that happens, your very next roll gets \u2605 ADVANTAGE: tap it and the dice roll twice, keeping the higher, with a quiet note explaining exactly why you earned it. It's rare on purpose \u2014 most scenes have none."},{icon:"\u27A4",title:"Choice buttons",body:"At real crossroads in the story \u2014 the big forks, not every action \u2014 the DM offers a few tappable \u27A4 options. Tap one to send it straight away, or ignore them and type whatever you'd rather do instead. The story stays yours."},{icon:"\u{1F310}",title:"Online table",body:"One person hosts: open \u2699 and tap HOST THIS TABLE ONLINE to get a six-letter code. Everyone else taps \u{1F310} JOIN A TABLE on their own device, enters the code and their name, then brings one of their own saved heroes or forges a new one on the spot \u2014 that character joins the host's party, and only its player can roll its dice. They get a live seat \u2014 the story, the DM's replies, and every dice roll appear on their screen, and they can act and roll from there. The host's app must stay open; the host's device runs the DM. Works between devices in the Claude app; on the GitHub edition it reaches between tabs on the same device."},{icon:"\u{1F4AC}",title:"DM Chat",body:"The \u{1F4AC} DM tab is a side channel to the Dungeon Master, fully out of character. Ask rules questions, 'can I use a bonus action here?', 'what are my options?' \u2014 you get a plain, direct answer and the story doesn't move an inch. When you're ready, return to the main window and act."},{icon:"\u{1F5D2}",title:"Your notes",body:"When you uncover something worth remembering \u2014 a lie caught by an Insight check, a rumor of hidden treasure, a name in a letter \u2014 the DM automatically writes it into the \u{1F5D2} Notes tab. Rumors of bonus loot caches land here too; chasing them tends to pay better than the main road."},{icon:"\u{1F5FA}",title:"The Atlas",body:"Every named place your party sets foot in \u2014 towns, ruins, roads, landmarks \u2014 is charted in the \u{1F5FA} Atlas tab automatically, in the order you found it, with a short note on what makes it memorable. It only ever grows."},{icon:"\u27F3",title:"Combat & positioning",body:"Combat runs in clear rounds \u2014 the tracker shows initiative and what every monster did, named foes show a red health bar that falls in real time as they're struck, and the DM addresses whoever's turn it is by name (act out of turn and the DM banks it for you). There's no grid: positioning is part of the story ('close enough to lunge', 'two rounds of running away'). Declare your action, roll when asked, then hear the result. Watch for traps \u2014 quick reflexes (DEX saves) matter."},{icon:"\u2699",title:"Settings & house rules",body:"The \u2699 gear holds the non-gameplay tools: rescue codes, narrator voice, and the adventure shelf. It's also where you set HOUSE RULES \u2014 standing orders the DM follows every scene, like 'aim for half combat, half talking' or 'keep scenes short'. They persist until you change them."},{icon:"\u{1F4DC}",title:"Player sheets",body:"Tap \u{1F4DC} to see both characters: health, XP, stats, abilities, and inventory. You can adjust anything by hand \u2014 fix HP, rename an item, tweak a stat \u2014 and the DM will honor it. Stats: STR is muscle, DEX is agility, CON is toughness, INT is book smarts, WIS is instinct, CHA is charm."},{icon:"\u2B06",title:"Leveling up",body:"The DM awards XP for clever plans, hard fights, and big story moments. When your XP bar fills (level \xD7 100), a LEVEL UP button appears on your sheet. It opens a choice of three upgrades designed for your character and your story \u2014 each one explains in plain language exactly what it does before you pick."},{icon:"\u2726",title:"Items & rewards",body:"The DM invents unique treasures tied to your story \u2014 named items with history and effects. They land in your inventory automatically and are listed on your sheet. Rarity runs common \u2192 uncommon \u2192 rare \u2192 legendary, and true magic is rare by design \u2014 roughly one real magic item every session or two, so each one is an event. Family heirlooms and personal gear carry real story weight, and if you invent a signature move of your own, the DM defines it with you once and honors it forever."},{icon:"\u{1F50A}",title:"Voice acting",body:"Tap \u{1F50A} to have the DM read scenes aloud \u2014 the narrator uses one voice, and each character speaks with their own (gruff, raspy, lilting\u2026). You can also tap \u25B6 on any single message. Voices come from your device, so quality varies by phone."},{icon:"\u{1F3AD}",title:"Cast of characters",body:"A portrait gallery of everyone you've met \u2014 each face painted from their name, with your notes on what you've learned and a candle meter showing how close you've grown. The DM privately gives each one a hidden agenda; the candles never spoil the secrets. The cast remembers everything between sessions."},{icon:"\u{1F4D3}",title:"The DM's notebook",body:"The self-training part. The DM takes notes on your table mid-game and again when you tap END SESSION \u2014 what you both enjoy, the right difficulty, running jokes, twists it plans to spring. Every future session is shaped by these notes. Ending sessions regularly is how the DM gets better."},{icon:"\u2754",title:"Stuck? Just ask",body:'The DM is also your guide. Type things like "what are our options?", "what does that roll mean?", or "explain what just happened" any time \u2014 it will step out from behind the screen, explain plainly, then drop back into the story. The \u2754 chip above the text box does this in one tap.'}],sl={height:"100%",background:"radial-gradient(ellipse at 50% -10%, #2A2018 0%, #17120D 55%)",color:"#EDE3C8",fontFamily:"'IM Fell English',Georgia,serif",display:"flex",flexDirection:"column",overflowX:"hidden",overflowY:"hidden",position:"relative"};function Ll({onDone:e}){return(0,o.useEffect)(()=>{let t=setTimeout(e,820);return()=>clearTimeout(t)},[]),o.default.createElement("div",{"aria-hidden":"true","data-dm-intro":"true",style:{position:"fixed",inset:0,zIndex:95,pointerEvents:"none",overflow:"hidden"}},o.default.createElement("div",{className:"dm-intro-scroll",style:{position:"absolute",inset:0,background:"radial-gradient(ellipse at 50% 50%, #2A2018 0%, #17120D 70%)"}}),o.default.createElement("div",{className:"dm-intro-seal",style:{position:"absolute",top:"50%",left:"50%",fontSize:46}},"\u{1F56F}\uFE0F"))}var ul=o.default.createElement("style",null,`
